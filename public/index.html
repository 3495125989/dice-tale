<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骰语 DiceTale v1.5.0</title>
<style>
:root{--bg:#0f1115;--bg2:#1a1d24;--bg3:#242830;--border:#2e3340;--text:#e4e6eb;--dim:#8b8fa3;--accent:#6c8cff;--gold:#d4a853;--red:#e05555;--green:#5ec48a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
#home{flex:1;overflow-y:auto;padding:20px}
.home-header{text-align:center;padding:30px 0 20px}
.logo{font-size:36px;font-weight:800;letter-spacing:6px}
.logo span{color:var(--accent)}
.subtitle{color:var(--dim);font-size:13px;margin-top:8px}
.role-cards{display:flex;gap:16px;max-width:700px;margin:0 auto;padding:20px 0}
.role-card{flex:1;background:var(--bg2);border:2px solid var(--border);border-radius:16px;padding:24px;cursor:pointer;text-align:center}
.role-card.active{border-color:var(--accent);background:var(--bg3)}
.role-card .icon{font-size:40px;margin-bottom:12px}
.form-box{max-width:420px;margin:0 auto;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
.form-group input,.form-group select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:15px;outline:none}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-primary{background:var(--accent);color:#fff}
#game{flex:1;display:none;flex-direction:column;height:100vh}
.topbar{height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
.room-badge{background:var(--gold);color:#1a1a1a;padding:6px 14px;border-radius:8px;font-weight:800;font-size:16px;letter-spacing:2px}
.players-info{color:var(--dim);font-size:13px}
.spacer{flex:1}
.dm-btn{background:var(--gold);color:#1a1a1a;border:none;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;margin-left:8px}
.main{flex:1;display:flex;overflow:hidden}
.sidebar-left{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.panel{border-bottom:1px solid var(--border);padding:14px}
.panel h3{font-size:12px;color:var(--dim);margin-bottom:10px;letter-spacing:1px}
.player-chip{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;margin-bottom:6px;background:var(--bg3);font-size:14px}
.player-chip.current{border:2px solid var(--green)}
.player-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.player-chip.ready .dot{background:var(--green)}
.dm-tag{background:var(--gold);color:#1a1a1a;font-size:11px;padding:2px 6px;border-radius:4px;font-weight:700}
.story{flex:1;overflow-y:auto;padding:20px 24px}
.log-entry{margin-bottom:18px}
.log-entry .who{font-size:12px;margin-bottom:4px;font-weight:600}
.log-entry.dm .who{color:var(--gold)}
.log-entry.action .who{color:var(--accent)}
.log-entry.dice .who{color:var(--green)}
.log-entry.system .who{color:var(--red)}
.log-entry .what{font-size:15px;line-height:1.7}
.log-entry.dice .what{font-size:24px;font-weight:800;color:var(--green)}
.sidebar-right{width:260px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.char-card{background:var(--bg3);border-radius:10px;padding:14px;margin-bottom:12px}
.char-card h4{font-size:15px;margin-bottom:8px}
.char-card .row{font-size:13px;color:var(--dim);margin-bottom:4px;line-height:1.5}
.input-bar{background:var(--bg2);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.input-bar input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;outline:none}
.dice-btn{background:var(--gold);color:#1a1a1a;border:none;padding:12px 16px;border-radius:10px;cursor:pointer;font-weight:800}
.send-btn{background:var(--accent);color:#fff;border:none;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:600}
.vote-box{max-width:600px;margin:0 auto;padding:20px}
.vote-option{background:var(--bg3);border:2px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer}
.vote-option.selected{border-color:var(--green)}
.stat-box{max-width:500px;margin:0 auto;padding:20px}
.stat-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.stat-row label{width:80px;font-size:14px}
.stat-row input[type=range]{flex:1}
.stat-row .val{width:30px;text-align:center;font-weight:700;color:var(--gold)}
textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-size:14px;min-height:60px;resize:vertical;outline:none;font-family:inherit}
.confirm-box{background:var(--bg3);border:2px solid var(--green);border-radius:12px;padding:20px;text-align:center;margin:20px 0}
</style>
</head>
<body>

<div id="home">
  <div class="home-header">
    <div class="logo">骰<span>语</span></div>
    <div class="subtitle">DiceTale v1.5.0 · 多人联机跑团主持台</div>
  </div>
  <div class="role-cards">
    <div class="role-card active" id="cardDM" onclick="chooseRole('dm')">
      <div class="icon">🎭</div><h3>我是主持人</h3><p>创建房间</p>
    </div>
    <div class="role-card" id="cardPlayer" onclick="chooseRole('player')">
      <div class="icon">🎲</div><h3>我是玩家</h3><p>输入房间号加入</p>
    </div>
  </div>
  <div id="formDM" class="form-box">
    <h2>🏠 创建主持房间</h2>
    <div class="form-group"><label>你的称呼</label><input id="createName" value="主持人"></div>
    <div class="form-group"><label>几个玩家？</label>
      <select id="maxPlayers"><option value="1">1个朋友</option><option value="2">2个朋友</option><option value="3" selected>3个朋友</option><option value="4">4个朋友</option></select>
    </div>
    <div class="form-group"><label>DeepSeek API Key（选填）</label>
      <input id="apiKey" type="password" placeholder="sk-...">
    </div>
    <button class="btn btn-primary" onclick="createRoom()">🚀 创建房间</button>
  </div>
  <div id="formPlayer" class="form-box" style="display:none">
    <h2>🚪 加入房间</h2>
    <div class="form-group"><label>房间号</label><input id="joinRoom" maxlength="4" style="text-transform:uppercase;font-size:20px;letter-spacing:4px;text-align:center" placeholder="ABCD"></div>
    <div class="form-group"><label>你的名字</label><input id="joinName" placeholder="你的名字"></div>
    <div class="form-group"><label>你的身份</label>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button type="button" id="modeCustom" class="btn btn-primary" style="margin-top:0" onclick="setMode('custom')">✍️ 自己写</button>
        <button type="button" id="modeRandom" class="btn" style="margin-top:0;border:1px solid var(--border);color:var(--dim);background:transparent" onclick="setMode('random')">🎲 随机</button>
      </div>
      <div id="customCharBox">
        <input id="joinRole" placeholder="你的身份，比如：退休警察">
      </div>
      <div id="randomCharBox" style="display:none;background:var(--bg3);padding:14px;border-radius:8px;font-size:14px">
        <div id="randomCharPreview">点上面"随机"按钮</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="joinRoom()">🎲 加入游戏</button>
  </div>
</div>

<div id="game">
  <div class="topbar">
    <span class="room-badge" id="topRoom">----</span>
    <span class="players-info" id="topPlayers"></span>
    <div class="spacer"></div>
    <button id="btnStartOutlines" class="dm-btn" onclick="startOutlines()" style="display:none">✏️ 开始写大纲</button>
    <button id="btnConfirmOutline" class="dm-btn" onclick="confirmOutline()" style="display:none;background:var(--green);color:#1a1a1a">✅ 确认并生成</button>
    <button id="btnNextTurn" class="dm-btn" onclick="nextTurn()" style="display:none">⏭️ 下一位</button>
  </div>
  <div class="main">
    <div class="sidebar-left">
      <div class="panel"><h3>👥 玩家</h3><div id="playerList"></div></div>
      <div class="panel"><h3>🎲 掷骰记录</h3><div id="diceList"></div></div>
      <div class="panel" id="dmPanel" style="display:none"><h3>⚙️ DM设置</h3>
        <div style="font-size:12px;color:var(--dim);margin-bottom:6px">属性总点数</div>
        <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px">
          <input type="range" id="dmPoints" min="5" max="30" value="10" style="flex:1" oninput="document.getElementById('dmPointsVal').textContent=this.value">
          <span id="dmPointsVal" style="font-weight:700;color:var(--gold)">10</span>
        </div>
        <button class="btn btn-primary" style="margin-top:8px;font-size:13px;padding:8px" onclick="setDmPoints()">应用</button>
        <div id="difficultyBox" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
          <div style="font-size:12px;color:var(--dim);margin-bottom:6px">🎲 当前检定难度（可调）</div>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="range" id="dmDifficulty" min="5" max="19" value="10" style="flex:1" oninput="document.getElementById('dmDifficultyVal').textContent=this.value">
            <span id="dmDifficultyVal" style="font-weight:700;color:var(--gold)">10</span>
          </div>
          <button class="btn btn-primary" style="margin-top:8px;font-size:13px;padding:8px" onclick="setDifficulty()">应用难度</button>
        </div>
      </div>
    </div>
    <div class="story" id="story"></div>
    <div class="sidebar-right">
      <div class="panel"><h3>🎭 我的角色</h3><div id="myChar"></div></div>
      <div class="panel"><h3>🎯 共同目标</h3><div id="mainGoal" style="font-size:13px;line-height:1.6;color:var(--gold)"></div></div>
      <div class="panel"><h3>📖 剧本</h3><div id="scenarioInfo" style="font-size:13px;line-height:1.6;color:var(--dim)"></div></div>
      <div class="panel"><h3>📒 公开笔记</h3>
        <textarea id="publicNotes" placeholder="大家一起记线索..." onchange="saveNotes(this.value)"></textarea>
      </div>
      <div class="panel"><h3>🔒 私人笔记</h3>
        <textarea id="privateNotes" placeholder="只有你能看到" style="min-height:100px" onchange="localStorage.setItem('dice_priv',this.value)"></textarea>
      </div>
    </div>
  </div>
  <div class="input-bar" id="dmBar" style="display:none">
    <input id="dmInput" placeholder="📢 描述场景..." onkeydown="if(event.key==='Enter')dmScene()">
    <button class="send-btn" onclick="dmScene()">发送</button>
  </div>
  <div class="input-bar" id="playerBar" style="display:none">
    <button class="dice-btn" onclick="rollDice()">🎲</button>
    <input id="actionInput" placeholder="✊ 你要做什么？" onkeydown="if(event.key==='Enter')sendAction()">
    <button class="send-btn" onclick="sendAction()">行动</button>
  </div>
  <div class="input-bar" id="lobbyBar" style="display:none">
    <button class="send-btn" id="readyBtn" onclick="toggleReady()" style="background:var(--green);color:#1a1a1a">✅ 准备</button>
  </div>
</div>

<script>
let ws=null,myId=null,isDM=false,room=null;
let statVals={str:1,agi:1,int:1,wil:1,con:1};
let charMode='custom';
const RANDOM_CHARS=['退休警察','大学生','外卖员','便利店店员','夜班司机','邮递员','装修工','小区保安','咖啡店老板','护士','程序员','厨师','图书管理员','健身教练','花店老板','会计'];

function chooseRole(r){document.getElementById('cardDM').classList.toggle('active',r==='dm');document.getElementById('cardPlayer').classList.toggle('active',r==='player');document.getElementById('formDM').style.display=r==='dm'?'':'none';document.getElementById('formPlayer').style.display=r==='player'?'':'none';}
function setMode(m){charMode=m;document.getElementById('customCharBox').style.display=m==='custom'?'':'none';document.getElementById('randomCharBox').style.display=m==='random'?'':'none';if(m==='random')document.getElementById('randomCharPreview').textContent=RANDOM_CHARS[Math.floor(Math.random()*RANDOM_CHARS.length)];}

function connect(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(proto+'//'+location.host+'/ws');
  ws.onmessage=function(e){
    const msg=JSON.parse(e.data);
    if(msg.type==='created'){myId=msg.myId;isDM=true;}
    if(msg.type==='joined'){myId=msg.myId;isDM=false;}
    if(msg.type==='state'){room=msg.data;render();}
    if(msg.type==='dm_review'){const di=document.getElementById('dmInput');if(di){di.value=msg.text;di.focus();alert('AI写了一段内容，你看看改改再发送');}}
    if(msg.type==='error'){alert(msg.msg);}
  };
  ws.onclose=function(){setTimeout(connect,3000);};
}
function createRoom(){const n=document.getElementById('createName').value||'DM';const k=document.getElementById('apiKey').value;const m=parseInt(document.getElementById('maxPlayers').value)||3;connect();ws.onopen=function(){ws.send(JSON.stringify({type:'create',name:n,apiKey:k,maxPlayers:m+1}));setTimeout(function(){document.getElementById('home').style.display='none';document.getElementById('game').style.display='flex';},500);};}
function joinRoom(){const r=document.getElementById('joinRoom').value.toUpperCase().trim();if(!r||r.length!==4){alert('房间号4位字母');return;}const n=document.getElementById('joinName').value.trim()||'玩家';let role='冒险者';if(charMode==='custom'){role=document.getElementById('joinRole').value.trim()||'冒险者';}else{role=document.getElementById('randomCharPreview').textContent;}connect();ws.onopen=function(){ws.send(JSON.stringify({type:'join',name:n,roomId:r,role:role}));setTimeout(function(){document.getElementById('home').style.display='none';document.getElementById('game').style.display='flex';},500);};}
function dmScene(){const v=document.getElementById('dmInput').value.trim();if(!v)return;ws.send(JSON.stringify({type:'dm_scene',text:v}));document.getElementById('dmInput').value='';}
function sendAction(){const v=document.getElementById('actionInput').value.trim();if(!v)return;ws.send(JSON.stringify({type:'player_action',text:v}));document.getElementById('actionInput').value='';}
function rollDice(){ws.send(JSON.stringify({type:'dice',sides:20}));}
function toggleReady(){ws.send(JSON.stringify({type:'player_ready'}));}
function startOutlines(){ws.send(JSON.stringify({type:'start_outlines'}))}
function submitOutline(){const v=document.getElementById('outlineInput').value.trim();if(!v){alert('写点再提交');return;}ws.send(JSON.stringify({type:'submit_outline',text:v}));}
function voteOutline(id){ws.send(JSON.stringify({type:'vote_outline',outlineId:id}));}
function confirmOutline(){ws.send(JSON.stringify({type:'confirm_outline'}));}
function nextTurn(){ws.send(JSON.stringify({type:'next_turn'}));}
function setDmPoints(){ws.send(JSON.stringify({type:'set_stat_points',points:parseInt(document.getElementById('dmPoints').value)}));}
function setDifficulty(){ws.send(JSON.stringify({type:'set_difficulty',difficulty:parseInt(document.getElementById('dmDifficulty').value)}));}
function saveNotes(v){ws.send(JSON.stringify({type:'update_notes',text:v}));}
function remainingPoints(){const t=room?room.statPoints||10:10;return t-Object.values(statVals).reduce(function(a,b){return a+b},0);}
function setStat(k,v){statVals[k]=parseInt(v);document.getElementById('statRem').innerHTML='剩余：<b>'+remainingPoints()+'</b>';document.getElementById('stat'+k.charAt(0).toUpperCase()+k.slice(1)+'Val').textContent=v;}
function saveStats(){if(remainingPoints()!==0){alert('还剩'+remainingPoints()+'点！');return;}ws.send(JSON.stringify({type:'set_stats',stats:Object.assign({},statVals)}));}

function render(){
  if(!room)return;
  document.getElementById('topRoom').textContent=room.id;
  document.getElementById('topPlayers').textContent=room.players.length+'/'+room.maxPlayers;
  document.getElementById('dmPanel').style.display=isDM?'':'none';
  document.getElementById('btnStartOutlines').style.display=(isDM&&room.state==='lobby')?'':'none';
  document.getElementById('btnNextTurn').style.display=(isDM&&room.state==='playing')?'':'none';

  // 玩家列表（显示准备状态）
  let pl='';
  room.players.forEach(function(p){
    const isCur=room.state==='playing'&&room.turnOrder[room.currentTurn]===p.id;
    pl+='<div class="player-chip'+(isCur?' current':'')+'"><span class="dot"></span>'+p.name+(p.isDM?'<span class="dm-tag">DM</span>':'')+(p.ready?' ✅':' ❌')+(isCur?' 👈':'')+'</div>';
  });
  document.getElementById('playerList').innerHTML=pl;

  // 掷骰记录
  const dl=room.log.filter(function(l){return l.type==='dice'}).slice(-8).reverse();
  document.getElementById('diceList').innerHTML=dl.length?dl.map(function(d){return '<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--dim)">'+d.player+'</span><span style="color:var(--gold);font-weight:700;margin-left:6px">d'+d.sides+'='+d.roll+'</span></div>';}).join(''):'<div style="font-size:12px;color:var(--dim)">还没人掷骰</div>';

  if(room.scenario){
    document.getElementById('scenarioInfo').innerHTML='<b style="color:var(--text)">《'+room.scenario.title+'》</b><br><br>'+(room.scenario.background||'');
    document.getElementById('mainGoal').textContent=room.scenario.mainGoal||'';
  }

  // 我的角色
  const me=room.players.find(function(p){return p.id===myId});
  if(me){
    let s='';if(me.stats){const x=me.stats;s='<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;line-height:1.8">💪'+x.str+' 🏃'+x.agi+' 🧠'+x.int+' 🧠理智'+x.wil+' ❤️'+x.con+'</div>';}
    let h='<div class="char-card"><h4>'+me.name+(me.isDM?'（DM）':'')+'</h4>';
    if(me.isDM){h+='<div class="row">讲故事和裁定</div>';}else{h+='<div class="row"><b style="color:var(--text)">身份：</b>'+(me.customRole||'冒险者')+'</div>';if(me.sideQuest)h+='<div class="row" style="margin-top:8px"><b style="color:var(--gold)">🔒 支线：</b><br>'+me.sideQuest+'</div>';}
    h+=s+'</div>';
    document.getElementById('myChar').innerHTML=h;
  }

  // 底部栏
  document.getElementById('dmBar').style.display=(isDM&&room.state==='playing')?'flex':'none';
  document.getElementById('playerBar').style.display=(!isDM&&room.state==='playing')?'flex':'none';
  document.getElementById('lobbyBar').style.display=(!isDM&&room.state==='lobby')?'flex':'none';
  if(me){const rb=document.getElementById('readyBtn');rb.textContent=me.ready?'✅ 已准备':'✅ 准备';rb.style.background=me.ready?'var(--dim)':'var(--green)';}

  // DM难度面板
  const db=document.getElementById('difficultyBox');
  if(isDM&&room.pendingDice){db.style.display='';document.getElementById('dmDifficulty').value=room.pendingDice.difficulty;document.getElementById('dmDifficultyVal').textContent=room.pendingDice.difficulty;}else{db.style.display='none';}

  // 公开笔记（不覆盖正在输入的）
  const pn=document.getElementById('publicNotes');
  if(pn&&document.activeElement!==pn)pn.value=room.publicNotes||'';
  const pv=document.getElementById('privateNotes');
  if(pv&&document.activeElement!==pv)pv.value=localStorage.getItem('dice_priv')||'';

  // 剧情区域
  const el=document.getElementById('story');
  // 属性分配
  if(room.state==='lobby'&&!isDM&&!(me&&me.stats)){
    el.innerHTML='<div class="stat-box"><h3 style="text-align:center;margin-bottom:16px">📊 分配属性（'+(room.statPoints||10)+'点）</h3>'+
      ['str','agi','int','wil','con'].map(function(k){
        const labels={str:'💪力量',agi:'🏃敏捷',int:'🧠智力',wil:'🧠理智',con:'❤️体质'};
        return '<div class="stat-row"><label>'+labels[k]+'</label><input type="range" min="1" max="10" value="1" oninput="setStat(\''+k+'\',this.value)"><span class="val" id="stat'+k.charAt(0).toUpperCase()+k.slice(1)+'Val">1</span></div>';
      }).join('')+
      '<div id="statRem" style="text-align:center;margin:12px 0;font-size:16px"></div>'+
      '<button class="btn btn-primary" onclick="saveStats()">✅ 确认</button></div>';
    document.getElementById('statRem').innerHTML='剩余：<b>'+remainingPoints()+'</b>';
  }
  // 写大纲
  else if(room.state==='outline'&&!isDM){
    const myOut=room.outlines&&me?room.outlines[me.id]:null;
    const prev=document.getElementById('outlineInput');
    const saved=prev?prev.value:'';
    if(myOut){
      el.innerHTML='<div class="vote-box"><div class="confirm-box"><b style="color:var(--green)">✅ 已提交</b><br>'+myOut.text+'</div><p style="color:var(--dim);text-align:center">等其他人提交...</p></div>';
    }else{
      el.innerHTML='<div class="vote-box"><h3 style="margin-bottom:16px">✏️ 写你想玩的大纲</h3><textarea id="outlineInput" style="min-height:120px" placeholder="比如：几个人在深山老屋里，外面下着暴风雪..."></textarea><button class="btn btn-primary" onclick="submitOutline()">📝 提交</button></div>';
      document.getElementById('outlineInput').value=saved;
    }
  }
  // 大纲投票
  else if(room.state==='outline_voting'&&room.outlines){
    const ids=Object.keys(room.outlines);
    const counts={};
    Object.values(room.votes||{}).forEach(function(i){counts[i]=(counts[i]||0)+1});
    const max=Math.max.apply(null,Object.values(counts).concat([0]));
    const winner=Object.keys(counts).find(function(k){return counts[k]===max&&max>0});
    let h='<div class="vote-box"><h3 style="margin-bottom:16px">🗳️ 投票选大纲</h3>';
    ids.forEach(function(id){
      const o=room.outlines[id];
      const voted=(room.votes||{})[me?me.id:0]===id;
      h+='<div class="vote-option'+(voted?' selected':'')+'" onclick="'+(voted?'':'voteOutline(\''+id+'\')')+'"><h4>'+o.name+'的大纲 '+(counts[id]?'<span style="color:var(--gold)">('+counts[id]+'票)</span>':'')+'</h4><p>'+o.text+'</p></div>';
    });
    if(isDM&&winner){
      h+='<div class="confirm-box"><b style="color:var(--green)">🎲 当前票数最多：'+room.outlines[winner].name+'的大纲</b><p style="margin-top:8px;color:var(--dim)">确认后生成开场白</p></div>';
      document.getElementById('btnConfirmOutline').style.display='';
    }else{
      document.getElementById('btnConfirmOutline').style.display='none';
    }
    h+='</div>';
    el.innerHTML=h;
  }
  else{
    document.getElementById('btnConfirmOutline').style.display='none';
    if(room.log.length===0){
      el.innerHTML='<div style="text-align:center;color:var(--dim);padding:60px"><div style="font-size:48px;margin-bottom:16px">🎭</div><p>'+(isDM?'等玩家到齐，点"开始写大纲"':'等DM...')+'</p></div>';
    }else{
      el.innerHTML=room.log.map(function(l){
        const wm={dm:'📢 主持人',dm_reply:'📢 主持人',action:l.player+' 的行动',dice:'🎲 '+l.player+' 掷骰',system:'⚡ 系统'};
        const tm={dm:l.text,dm_reply:l.text,action:l.text,dice:'d'+l.sides+'='+l.roll,system:l.text};
        return '<div class="log-entry '+l.type+'"><div class="who">'+(wm[l.type]||'')+'</div><div class="what">'+(tm[l.type]||'')+'</div></div>';
      }).join('');
    }
  }
  el.scrollTop=el.scrollHeight;
}
</script>
</body>
</html>
